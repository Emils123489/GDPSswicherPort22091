name: Build GDPS Switcher + Server API (GD 2.2091)

# Builds Server API first, installs it into the build profile so the GDPS Switcher
# build can find it (Server API 4.1.0 is not on the Geode Index yet), then builds
# GDPS Switcher. Both combined .geode files end up in the "build-output" artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  server-api:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: ubuntu-latest, target: Win64 }
          - { name: macOS, os: macos-latest, target: MacOS }
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
          - { name: iOS, os: macos-latest, target: iOS }
    name: Server API (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build Server API
        uses: hiimjasmine00/build-geode-mod@xwin
        with:
          path: server-api
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          build-config: Release
          target: ${{ matrix.config.target }}

  server-api-package:
    name: Package Server API
    runs-on: ubuntu-latest
    needs: ['server-api']
    permissions:
      actions: write # lets combine delete the per-platform artifacts so the next stage can reuse their names
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: server-api
          path: ${{ steps.build.outputs.build-output }}/*.geode

  gdps-switcher:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: ubuntu-latest, target: Win64 }
          - { name: macOS, os: macos-latest, target: MacOS }
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
          - { name: iOS, os: macos-latest, target: iOS }
    name: GDPS Switcher (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    needs: ['server-api-package']
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # The build action's Geode CLI profile looks for installed mods here
      - name: Install Server API into the build profile
        uses: actions/download-artifact@v4
        with:
          name: server-api
          path: ${{ github.workspace }}/cli-profile/geode/mods

      - name: Build GDPS Switcher
        uses: hiimjasmine00/build-geode-mod@xwin
        with:
          path: gdps-switcher
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          build-config: Release
          target: ${{ matrix.config.target }}

  package:
    name: Package everything
    runs-on: ubuntu-latest
    needs: ['gdps-switcher']
    permissions:
      actions: write
    steps:
      # Set Server API aside so combine only sees the switcher's per-platform builds
      - uses: actions/download-artifact@v4
        with:
          name: server-api
          path: server-api-out

      - uses: geekyeggo/delete-artifact@v6
        with:
          name: server-api

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Add Server API to the output
        run: cp server-api-out/*.geode "${{ steps.build.outputs.build-output }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ steps.build.outputs.build-output }}
